[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kenshi-save-edit"
version = "0.1.0"
description = "Safe command-line editor for Kenshi saves"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/bavadim/kenshi-save-edit"
Repository = "https://github.com/bavadim/kenshi-save-edit"

[project.scripts]
kenshi-save-edit = "kenshi_save_edit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
